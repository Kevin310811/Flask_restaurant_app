    <link rel="stylesheet" href="CSS/nav-styles.css">
    <link rel="stylesheet" href="CSS/payment-style.css">
    <link rel="icon" type="image/x-icon" href="Images/favicon.png">
</head>
<body>

    <nav>
        <h1 class="logo"><a href="index.html">Restaurant Logo</a></h1>
        <ul>
            <li class="page-label"><a href="reservations.html">Reservations</a></li>
            <li class="page-label"><a href="order.html">Order</a></li>
            <li class="page-label"><a href="gallery.html">Gallery</a></li>
            <li class="page-label"><a href="#">About</a></li>
            <li onclick=showSidebar() class="ham-menu"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="26px"
                        viewBox="0 -960 960 960" width="26px" fill="#FFFFFF">
                        <path d="M120-240v-60h720v60H120Zm0-210v-60h720v60H120Zm0-210v-60h720v60H120Z" />
                    </svg></a></li>
        </ul>

        <div class="sidebar">
            <ul>
                <li onclick=hideSidebar() class="sidebar-item"><a href="#"><svg xmlns="http://www.w3.org/2000/svg"
                            height="26px" viewBox="0 -960 960 960" width="26px" fill="#FFFFFF">
                            <path d="m249-207-42-42 231-231-231-231 42-42 231 231 231-231 42 42-231 231 231 231-42 42-231-231-231 231Z" />
                        </svg></a></li>
                <li class="sidebar-item"><a href="reservations.html">Reservations</a></li>
                <li class="sidebar-item"><a href="order.html">Order</a></li>
                <li class="sidebar-item"><a href="#">Gallery</a></li>
                <li class="sidebar-item"><a href="#">About</a></li>
            </ul>
        </div>
    </nav>

    <section class="payment-page">
        <div class="payment-box">

            <!-- Order Summary -->
            <h2 class="payment-title">Order Summary</h2>
            <ul id="payment-items"></ul>

            <div class="payment-divider"></div>

            <!-- Tip Section -->
            <h2 class="payment-title">Add a Tip</h2>
            <div class="tip-presets">
                <button class="tip-btn" data-percent="10">10%</button>
                <button class="tip-btn" data-percent="15">15%</button>
                <button class="tip-btn" data-percent="20">20%</button>
                <button class="tip-btn" data-percent="0">No Tip</button>
            </div>
            <div class="tip-custom">
                <label for="custom-tip">Custom tip (₹):</label>
                <input type="number" id="custom-tip" min="0" placeholder="Enter amount">
            </div>

            <div class="payment-divider"></div>

            <!-- Calculation Breakdown -->
            <div class="payment-breakdown">
                <div class="breakdown-row">
                    <span>Subtotal</span>
                    <span id="payment-subtotal">₹0.00</span>
                </div>
                <div class="breakdown-row">
                    <span>Tip</span>
                    <span id="tip-amount">₹0.00</span>
                </div>
                <div class="breakdown-row breakdown-total">
                    <span>Total</span>
                    <span id="payment-total">₹0.00</span>
                </div>
            </div>

            <div class="payment-divider"></div>

            <!-- Action Buttons -->
            <div class="payment-actions">
                <button id="edit-order-btn">Edit Order</button>
                <button id="pay-btn">Pay Now</button>
            </div>

        </div>
    </section>

    <footer>
        <img src="Images/davide-cantelli-jpkfc5_d-DI-unsplash.jpg" alt="food" class="no-select">
        <h1>Restaurant Logo</h1>
        <div class="quick-links">
            <a href="#">Reservations</a>
            <a href="#">Menu</a>
            <a href="#">Gallery</a>
            <a href="#">About</a>
        </div>
        <div class="quick-links-2">
            <a href="#">Youtube</a>
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="">link 4</a>
        </div>
    </footer>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="JS/payment.js"></script>
</body>
</html>
