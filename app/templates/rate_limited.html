{% extends 'base.html' %}

{% block title %}Too Many Requests{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/auth.css') }}">
{% endblock %}

{% block content %}
<main>
<section class="auth-page">
    <div class="auth-box">
        <h1 class="auth-title">Slow down a little</h1>
        <p class="auth-subtitle">You've made too many requests in a short time. Please wait a minute and try again.</p>
        <p class="auth-switch"><a href="{{ url_for('main.index') }}">&larr; Back to home</a></p>
    </div>
</section>
</main>
{% endblock %}
